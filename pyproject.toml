[project]
name = "sda-skeleton"
version = "1.0.0"
description = "sda-skeleton"
authors = [{ name = "Sooraj Rajagopalan", email = "unusual.terrain.9@gmail.com" }]
requires-python = ">=3.13"
readme = "README.md"
license = { text = "Commercial" }
dependencies = [
    "fastapi[standard] (>=0.115.11,<0.116.0)",
    "sqlmodel (>=0.0.24,<0.0.25)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "sqlalchemy (>=2.0.40,<3.0.0)",
    "greenlet (>=3.1.1,<4.0.0)",
    "strawberry-graphql[fastapi]>=0.266.1",
    "azure-storage-blob>=12.25.1",
    "azure-identity>=1.23.0",
    "pytest-asyncio>=0.26.0",
    "tzdata>=2025.2",
    "neomodel>=6.0.0",
    "python-jose>=3.3.0",
]

[project.scripts]
lint = "flake8 ."
format = "isort . && black ."

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9",
    "uvicorn>=0.34.0,<0.35",
    "flake8>=7.2.0,<8",
    "black>=25.1.0,<26",
    "pytest-mock>=3.14.0,<4",
    "pytest-asyncio>=0.26.0,<0.27",
    "httpx>=0.28.1,<0.29",
    "isort>=6.0.1,<7",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88  # Default line length in black (matches the flake8 config)
target-version = ['py310']  # Adjust for your Python version (e.g., py39, py38)
exclude = '''
/(
    \.git              # Exclude .git folder
    | \.tox             # Exclude .tox folder
    | \.venv            # Exclude .venv folder
    | build             # Exclude build folder
    | dist              # Exclude dist folder
    | migrations        # Exclude migrations folder
    | tests             # Exclude tests folder (optional)
    | library_name      # Exclude a specific library
)/
'''

